name: CI

on:
  push:
    branches: ["**"]        # every branch, every push
  pull_request:
    branches: [main]        # all PRs targeting main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # cancel in-flight runs on the same branch when a new commit arrives

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Lint
  # Fast ESLint check — no build artefacts or DB connection needed.
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: ci / lint
    runs-on: ubuntu-latest
    # Skip gracefully when package-lock.json doesn't exist yet (pre FE-01).
    # GitHub treats jobs skipped via if: as passing for required status checks.
    if: "${{ hashFiles('package-lock.json') != '' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Typecheck
  # Full TypeScript compile (no emit). Must pass before build runs.
  # ─────────────────────────────────────────────────────────────────
  typecheck:
    name: ci / typecheck
    runs-on: ubuntu-latest
    if: "${{ hashFiles('package-lock.json') != '' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run TypeScript type check
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Build
  # Production Next.js build. Blocked on typecheck — fail fast.
  # Env vars are stubs: the build does not start a server or make
  # network calls, so placeholder values are safe. Do NOT use real
  # secrets here — principle of least privilege.
  # ─────────────────────────────────────────────────────────────────
  build:
    name: ci / build
    runs-on: ubuntu-latest
    needs: [typecheck]
    if: "${{ hashFiles('package-lock.json') != '' }}"
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost/ci?sslmode=disable"
      DATABASE_URL_UNPOOLED: "postgresql://ci:ci@localhost/ci?sslmode=disable"
      NEXT_PUBLIC_APP_URL: "https://ci.example.com"
      QSTASH_URL: "https://qstash.upstash.io"
      QSTASH_TOKEN: "ci_placeholder"
      QSTASH_CURRENT_SIGNING_KEY: "sig_ci_placeholder"
      QSTASH_NEXT_SIGNING_KEY: "sig_ci_placeholder"
      CRON_SECRET: "ci_placeholder_32chars_xxxxxxxxxxxxxxxx"
      OLLAMA_BASE_URL: "https://ollama.example.com"
      OLLAMA_MODEL: "llama3.2:3b"
      OLLAMA_EMBED_MODEL: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
      GROQ_API_KEY: "gsk_ci_placeholder"
      RESEND_API_KEY: "re_ci_placeholder"
      RESEND_FROM_EMAIL: "noreply@example.com"
      BROWSERLESS_URL: "wss://browserless.example.com"
      BROWSERLESS_TOKEN: "ci_placeholder"
      UPSTASH_REDIS_REST_URL: "https://redis.example.com"
      UPSTASH_REDIS_REST_TOKEN: "ci_placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build Next.js application
        run: npm run build

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Schema check
  # Detects schema drift: runs drizzle-kit generate and checks whether
  # the drizzle/ migration folder is dirty. A dirty tree means
  # src/db/schema.ts was changed but the migration SQL was not
  # committed — fails with an actionable error message.
  #
  # No DB connection required. drizzle-kit generate works from the
  # TypeScript schema alone. The introspect step (which needs
  # DATABASE_URL_UNPOOLED) is intentionally excluded — running it
  # against production Neon on every CI push is a security concern.
  # Re-enable against a dev Neon branch once DEVOPS-03 is complete.
  # (FULLSTACK-REVIEW ISSUE-W12)
  # ─────────────────────────────────────────────────────────────────
  schema-check:
    name: ci / schema-check
    runs-on: ubuntu-latest
    if: "${{ hashFiles('package-lock.json') != '' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check for schema drift
        # drizzle-kit must be in devDependencies (added in BE-01) so npm ci
        # installs it and npx uses the local version — not a fresh download.
        run: |
          npx drizzle-kit generate --config drizzle.config.ts
          if ! git diff --exit-code drizzle/; then
            echo "::error::Schema drift detected: src/db/schema.ts has changes not reflected in committed migration files."
            echo "::error::Run 'npx drizzle-kit generate' locally and commit the generated SQL files."
            exit 1
          fi
