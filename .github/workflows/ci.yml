name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────
  lint:
    name: ci / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json yet (project initialises in FE-01). Skipping."
            exit 0
          fi
          npm ci --prefer-offline
          npm run lint

  # ── Job 2: Typecheck ─────────────────────────────────────────────
  typecheck:
    name: ci / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json yet (project initialises in FE-01). Skipping."
            exit 0
          fi
          npm ci --prefer-offline
          npm run typecheck

  # ── Job 3: Test ──────────────────────────────────────────────────
  # Runs vitest in CI mode (no watch, no browser). NODE_ENV=test is
  # set by Vitest automatically; env.ts skips validation in test mode.
  test:
    name: ci / test
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json yet (project initialises in FE-01). Skipping."
            exit 0
          fi
          npm ci --prefer-offline
          npm run test:run

  # ── Job 4: Build ─────────────────────────────────────────────────
  # Depends on typecheck. Env vars are stubs — build does not start
  # a server or make network calls; placeholders are safe here.
  # Do NOT use real secrets in this job (principle of least privilege).
  build:
    name: ci / build
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost/ci?sslmode=disable"
      DATABASE_URL_UNPOOLED: "postgresql://ci:ci@localhost/ci?sslmode=disable"
      NEXT_PUBLIC_APP_URL: "https://ci.example.com"
      QSTASH_URL: "https://qstash.upstash.io"
      QSTASH_TOKEN: "ci_placeholder"
      QSTASH_CURRENT_SIGNING_KEY: "sig_ci_placeholder"
      QSTASH_NEXT_SIGNING_KEY: "sig_ci_placeholder"
      CRON_SECRET: "ci_placeholder_32chars_xxxxxxxxxxxxxxxx"
      HUGGINGFACE_API_KEY: "hf_ci_placeholder"
      GROQ_API_KEY: "gsk_ci_placeholder"
      RESEND_API_KEY: "re_ci_placeholder"
      RESEND_FROM_EMAIL: "noreply@example.com"
      BROWSERLESS_URL: "wss://browserless.example.com"
      BROWSERLESS_TOKEN: "ci_placeholder"
      UPSTASH_REDIS_REST_URL: "https://redis.example.com"
      UPSTASH_REDIS_REST_TOKEN: "ci_placeholder"
      WATCHES_API_KEY: "ci_placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json yet (project initialises in FE-01). Skipping."
            exit 0
          fi
          npm ci --prefer-offline
          npm run build

  # ── Job 5: Schema check ──────────────────────────────────────────
  # Detects drift between src/db/schema.ts and committed migrations.
  # drizzle-kit generate needs no DB connection — schema only.
  # (FULLSTACK-REVIEW ISSUE-W12: drizzle-kit introspect excluded to
  # avoid hitting production Neon on every CI push.)
  schema-check:
    name: ci / schema-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Schema drift check
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json yet (project initialises in FE-01). Skipping."
            exit 0
          fi
          if [ ! -f drizzle.config.ts ]; then
            echo "No drizzle.config.ts yet (created in BE-01). Skipping."
            exit 0
          fi
          npm ci --prefer-offline
          npx drizzle-kit generate --config drizzle.config.ts
          if ! git diff --exit-code drizzle/; then
            echo "::error::Schema drift detected: src/db/schema.ts has changes not reflected in committed migrations."
            echo "::error::Run 'npx drizzle-kit generate' locally and commit the output."
            exit 1
          fi

  # ── Job 6: Dependency security audit ─────────────────────────────
  # Fails on HIGH or CRITICAL severity vulnerabilities.
  # --omit=dev: production dependencies only (dev tools have their own vuln history).
  audit:
    name: ci / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev
